services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8080

    volumes:
      - /srv/apps/qbittorrent:/config
      - /srv/media/Downloads:/downloads

    ports:
      - "8080:8080"
      - "6881:6881/tcp"
      - "6881:6881/udp"

    networks:
      - homelab

networks:
  homelab:
    external: true
