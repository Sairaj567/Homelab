# ~/homelab/homepage/config/settings.yaml
theme: dark
color: slate

headerStyle: clean
shading: visual

background:
  image: https://images.unsplash.com/photo-1491466424936-e304919aada7
  blur: sm
  saturate: 50
  opacity: 50

layout:
  # === ⚡ SYSTEM MONITOR TAB (default — lands here first) ===
  - System Overview:
      tab: "⚡ System Monitor"
      style: row
      columns: 4
  - Performance Graphs:
      tab: "⚡ System Monitor"
      style: row
      columns: 3
  - Storage & Network:
      tab: "⚡ System Monitor"
      style: row
      columns: 3
  - Containers & Processes:
      tab: "⚡ System Monitor"
      style: row
      columns: 2

  # === 🏠 HOME TAB ===
  - Media & Entertainment:
      tab: "🏠 Home"
      style: row
      columns: 3
  - Media Management:
      tab: "🏠 Home"
      style: row
      columns: 3
  - Storage & Infrastructure:
      tab: "🏠 Home"
      style: row
      columns: 3
