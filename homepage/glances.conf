# Glances Configuration File
[global]
refresh=2
history_size=28800

[quicklook]
cpu_careful=50
cpu_warning=70
cpu_critical=90
mem_careful=50
mem_warning=70
mem_critical=90

[network]
# Hide loopback and docker virtual interfaces to keep network view clean
hide=lo,veth.*,br-.*,docker0

[fs]
# Hide virtual container mount points
hide=/etc/resolv.conf,/etc/hostname,/etc/hosts

[sensors]
# Hide 0C dummy ACPI sensors
hide=acpitz.*,BAT.*

[outputs]
curse_theme=dark

# REST API settings for Homepage widget integration
[restful]
max_history=28800
cors_origin=*
cors_methods=GET
